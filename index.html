<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <form action="">
        <div class="container">
        <h1>Registration Form</h1>
        <p>Plase fill the form to register with us </p>
    <hr/>


    <label for="fn">First Name:</label>
    <input type="text" placeholder="Enter your first name" name="fn" id="fn" required>
     

    <label for="psw">Password:</label>
    <input type="password" placeholder="Enter your password" name="psw" id="psw" required>

    <label for="cpcw">Confirm Password:</label>
    <input type="password" placeholder="Confirm your password" name="cpcw" id="cpcw" required>
    <hr/>
    <button type="submit">Register</button>
    </form>
    </div>
    
</body>
</html>
